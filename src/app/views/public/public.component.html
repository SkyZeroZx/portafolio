<div class="public-page">
	<app-home (contentRequested)="scrollTo()" />
	<app-about />
	@defer (on viewport) {
		<app-angular-security />
	} @placeholder {
		<section id="angular-security" class="public-page__deferred-section">
			<div class="section-shell public-page__deferred-shell">
				<app-list-skeleton variant="section" [rows]="1" ariaLabel="Loading Angular security" />
			</div>
		</section>
	}
	@defer (on viewport) {
		<app-angular-prs />
	} @placeholder {
		<section id="angular-prs" class="public-page__deferred-section">
			<div class="section-shell public-page__deferred-shell">
				<app-list-skeleton variant="section" [rows]="1" ariaLabel="Loading Angular pull requests" />
			</div>
		</section>
	}
	<app-experience />
	<app-portfolio />
	<app-contact />
	<app-footer />
</div>
